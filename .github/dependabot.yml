version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]

  # agent-relay has no runtime dependencies (standard library only); the only Python
  # declaration is `[build-system] requires` in pyproject.toml. Dependabot pull requests
  # are read and merged by hand -- no auto-merge.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python:
        patterns: ["*"]
